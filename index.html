<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAT - Command & Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

    <!-- 🔐 قسم الدخول وإنشاء الحساب -->
    <div id="auth-section" class="flex items-center justify-center h-screen">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-xl w-96 shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-shield-halved text-red-600 text-4xl mb-2"></i>
                <h1 id="auth-title" class="text-2xl font-bold tracking-wider text-red-600">تسجيل الدخول</h1>
                <p id="auth-subtitle" class="text-zinc-400 text-sm mt-1">لوحة قيادة فرقة SWAT</p>
            </div>
            
            <form id="auth-form" class="space-y-4">
                <div id="name-field-container" class="hidden">
                    <label class="block text-sm text-zinc-400 mb-1">الاسم الكامل / الـ Callsign</label>
                    <input type="text" id="signup-name" placeholder="مثال: S-01 Ghost" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 focus:outline-none focus:border-red-600 text-zinc-100 text-sm">
                </div>
                <div>
                    <label class="block text-sm text-zinc-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="auth-email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 focus:outline-none focus:border-red-600 text-zinc-100 text-sm">
                </div>
                <div>
                    <label class="block text-sm text-zinc-400 mb-1">كلمة المرور</label>
                    <input type="password" id="auth-password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 focus:outline-none focus:border-red-600 text-zinc-100 text-sm">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg transition text-sm">دخول للوحة التحكم</button>
            </form>

            <p id="auth-error" class="text-red-500 text-xs text-center mt-4"></p>

            <div class="text-center mt-6 border-t border-zinc-800 pt-4">
                <button id="toggle-auth-mode" class="text-xs text-zinc-400 hover:text-red-500 transition">
                    ليس لديك حساب؟ <span class="text-red-500 font-bold">أنشئ حساباً جديداً</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 📊 لوحة التحكم الرئيسية -->
    <div id="dashboard-section" class="hidden flex h-screen overflow-hidden">
        
        <!-- القائمة الجانبية -->
        <aside class="w-64 bg-zinc-900 border-r border-zinc-800 p-5 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <i class="fa-solid fa-shield-halved text-red-600 text-xl"></i>
                    <h1 class="font-bold tracking-wider text-base">SWAT PANEL</h1>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-red-600/10 text-red-500 font-medium text-sm">
                        <i class="fa-solid fa-users w-5"></i> إدارة الأعضاء
                    </a>
                </nav>
            </div>
            <button id="logout-btn" class="w-full flex items-center justify-center gap-2 bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white py-2 rounded-lg text-sm transition font-medium border border-red-600/30">
                <i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج
            </button>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8 pb-4 border-b border-zinc-800">
                <div>
                    <h2 class="text-2xl font-bold" id="panel-heading">لوحة التحكم</h2>
                    <p class="text-zinc-400 text-sm">إدارة عناصر العمليات والوحدات الميدانية عبر Firestore</p>
                </div>
                <span id="role-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل
                </span>
            </header>

            <!-- نموذج إضافة عنصر (يظهر فقط للقائد) -->
            <div id="commander-actions" class="hidden bg-zinc-900 border border-zinc-800 p-6 rounded-xl mb-8">
                <h3 class="text-base font-semibold mb-4 text-red-500 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> إضافة عنصر للقاعدة
                </h3>
                <form id="add-member-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="fullName" placeholder="الاسم الكامل" required class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    <input type="text" id="callsign" placeholder="Callsign (مثل: S-01)" required class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    <input type="text" id="rank" placeholder="الرتبة (مثل: Captain)" required class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    <input type="text" id="team" placeholder="الفريق (مثل: Alpha)" required class="bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    <button type="submit" class="md:col-span-4 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium transition text-sm">حفظ في القاعدة</button>
                </form>
            </div>

            <!-- جدول الأعضاء -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-lg">
                <div class="p-4 border-b border-zinc-800 font-semibold text-sm text-zinc-300">قائمة العناصر المسجلة</div>
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 text-zinc-400 text-xs bg-zinc-950/50">
                            <th class="p-4">الاسم</th>
                            <th class="p-4">Callsign</th>
                            <th class="p-4">الرتبة</th>
                            <th class="p-4">الفريق</th>
                            <th class="p-4">الحالة</th>
                            <th class="p-4" id="actions-header">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="members-table" class="divide-y divide-zinc-800 text-sm">
                        <!-- سيتم جلب الأعضاء هنا برمجياً -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ⚡ كود البرمجة والربط -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCme2UV_t_VYbE6KybmV53JyU5QBM4sQw",
            authDomain: "swat-panel.firebaseapp.com",
            projectId: "swat-panel",
            storageBucket: "swat-panel.firebasestorage.app",
            messagingSenderId: "572413842333",
            appId: "1:572413842333:web:bb4f91b6686b39817ed574",
            measurementId: "G-NSNZ06CDSJ"
        };

        // 🛑 إيميلك الخاص محدد كقائد رسمي للنظام
        const COMMANDER_EMAIL = "karlosoussama7@gmail.com"; 

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authSection = document.getElementById("auth-section");
        const dashboardSection = document.getElementById("dashboard-section");
        const authForm = document.getElementById("auth-form");
        const authTitle = document.getElementById("auth-title");
        const authSubtitle = document.getElementById("auth-subtitle");
        const authBtn = document.getElementById("auth-btn");
        const authError = document.getElementById("auth-error");
        const toggleAuthModeBtn = document.getElementById("toggle-auth-mode");
        const nameFieldContainer = document.getElementById("name-field-container");
        
        const logoutBtn = document.getElementById("logout-btn");
        const addMemberForm = document.getElementById("add-member-form");
        const commanderActions = document.getElementById("commander-actions");
        const membersTable = document.getElementById("members-table");
        const panelHeading = document.getElementById("panel-heading");
        const roleBadge = document.getElementById("role-badge");
        const actionsHeader = document.getElementById("actions-header");

        let isSignUpMode = false;

        toggleAuthModeBtn.addEventListener("click", () => {
            isSignUpMode = !isSignUpMode;
            authError.textContent = "";
            if (isSignUpMode) {
                authTitle.textContent = "إنشاء حساب جديد";
                authSubtitle.textContent = "سجل حسابك الخاص بالفرقة مباشرة";
                authBtn.textContent = "إتمام التسجيل";
                nameFieldContainer.classList.remove("hidden");
                toggleAuthModeBtn.innerHTML = 'لديك حساب بالفعل؟ <span class="text-red-500 font-bold">تسجيل الدخول</span>';
            } else {
                authTitle.textContent = "تسجيل الدخول";
                authSubtitle.textContent = "لوحة قيادة فرقة SWAT";
                authBtn.textContent = "دخول للوحة التحكم";
                nameFieldContainer.classList.add("hidden");
                toggleAuthModeBtn.innerHTML = 'ليس لديك حساب؟ <span class="text-red-500 font-bold">أنشئ حساباً جديداً</span>';
            }
        });

        // مراقبة حالة الدخول وتحديد الصلاحيات
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.classList.add("hidden");
                dashboardSection.classList.remove("hidden");

                if (user.email.toLowerCase() === COMMANDER_EMAIL.toLowerCase()) {
                    panelHeading.textContent = "لوحة تحكم القائد (Commander Panel)";
                    roleBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> متصل كقائد`;
                    roleBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                    commanderActions.classList.remove("hidden");
                    actionsHeader.style.display = "table-cell";
                } else {
                    panelHeading.textContent = "لوحة الأعضاء (Personnel View)";
                    roleBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل كعضو`;
                    roleBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                    commanderActions.classList.add("hidden");
                    actionsHeader.style.display = "none";
                }
                loadMembers(user.email.toLowerCase() === COMMANDER_EMAIL.toLowerCase());
            } else {
                dashboardSection.classList.add("hidden");
                authSection.classList.remove("hidden");
            }
        });

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("auth-email").value;
            const password = document.getElementById("auth-password").value;
            authError.textContent = "";

            try {
                if (isSignUpMode) {
                    const fullName = document.getElementById("signup-name").value || "عضو جديد";
                    await createUserWithEmailAndPassword(auth, email, password);
                    
                    await addDoc(collection(db, "members"), {
                        fullName: fullName,
                        callsign: "غير محدد",
                        rank: "Officer",
                        team: "General",
                        status: "Active"
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                authError.textContent = "حدث خطأ: تأكد من صحة البريد أو كلمة المرور (6 أحرف على الأقل).";
            }
        });

        logoutBtn.addEventListener("click", async () => {
            await signOut(auth);
        });

        if (addMemberForm) {
            addMemberForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const fullName = document.getElementById("fullName").value;
                const callsign = document.getElementById("callsign").value;
                const rank = document.getElementById("rank").value;
                const team = document.getElementById("team").value;

                try {
                    await addDoc(collection(db, "members"), {
                        fullName, callsign, rank, team, status: "Active"
                    });
                    addMemberForm.reset();
                    loadMembers(true);
                } catch (err) {
                    console.error(err);
                }
            });
        }

        async function loadMembers(isCommander) {
            membersTable.innerHTML = "";
            try {
                const querySnapshot = await getDocs(collection(db, "members"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const row = document.createElement("tr");
                    row.className = "hover:bg-zinc-900/50 transition";
                    
                    let actionTd = isCommander ? `
                        <td class="p-4">
                            <button onclick="deleteMember('${docSnap.id}')" class="text-red-400 hover:text-red-300 text-xs bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-3 py-1.5 rounded-lg transition">حذف</button>
                        </td>` : '';

                    row.innerHTML = `
                        <td class="p-4 font-medium">${data.fullName}</td>
                        <td class="p-4 text-red-500 font-bold">${data.callsign}</td>
                        <td class="p-4 text-zinc-300">${data.rank}</td>
                        <td class="p-4 text-zinc-300">${data.team}</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs">${data.status}</span></td>
                        ${actionTd}
                    `;
                    membersTable.appendChild(row);
                });
            } catch (err) {
                console.error(err);
            }
        }

        window.deleteMember = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا العضو؟")) {
                try {
                    await deleteDoc(doc(db, "members", id));
                    loadMembers(true);
                } catch (err) {
                    console.error(err);
                }
            }
        }
    </script>
</body>
</html>
